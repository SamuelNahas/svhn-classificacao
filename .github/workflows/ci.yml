name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    name: Notebook (modo de teste)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências (PyTorch CPU)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install nbconvert ipykernel

      - name: Executar o notebook com dados aleatórios
        env:
          SVHN_SMOKE: "1"
        run: jupyter nbconvert --to notebook --execute svhn.ipynb --output smoke-executed.ipynb --ExecutePreprocessor.timeout=900

      - name: Conferir as saídas
        run: python tests/check_smoke.py smoke

      - name: Guardar o notebook executado e as saídas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            smoke-executed.ipynb
            smoke/results/
          if-no-files-found: ignore
